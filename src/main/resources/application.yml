server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://mysql:3306/healthcheck?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: healthcheck
    password: healthcheck123
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  mail:
    host: smtp.localhost
    port: 25
    username: ""
    password: ""
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

app:
  jwt:
    secret: healthcheck-hpe-secret-key-2024-very-long-secure
    expiration: 86400000

logging:
  level:
    com.healthcheck: INFO
